<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>food delivery</title>
    <link rel="icon" type="image/png" href="./images/logo-site.png" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
  </head>
  <body>
    <!-- header -->
    <header class="header">
      <div class="container">
        <nav class="nav">
          <div class="nav-content">
            <div class="nav-content__logo">
              <img
                src="./images/logo-header.png"
                class="nav-content__img"
                alt="header Logo"
              />
            </div>
            <ul class="menu-list">
              <li
                data-section="homepage"
                class="menu-list__item menu-list__item--active"
              >
                <a href="#" class="menu-list__item__link">Homepage</a>
              </li>
              <li data-section="menu" class="menu-list__item">
                <a href="#" class="menu-list__item__link">Menu</a>
              </li>
              <li data-section="sale-off" class="menu-list__item">
                <a href="#" class="menu-list__item__link">Sale off</a>
              </li>
              <li data-section="news" class="menu-list__item">
                <a href="#" class="menu-list__item__link">News</a>
              </li>
              <li data-section="contact" class="menu-list__item">
                <a href="#" class="menu-list__item__link">Contact</a>
              </li>
            </ul>
          </div>
          <div class="nav-btn">
            <a
              href="auth.html?form=signup"
              class="nav-btn__link nav-btn__link--sign"
              >Sign in</a
            >
            <a
              href="auth.html?form=login"
              class="nav-btn__link nav-btn__link--log"
              >Log in</a
            >
          </div>
          <div class="nav-toggle__icon">
            <div class="nav-toggle__line"></div>
          </div>
        </nav>
      </div>
    </header>
    <main class="main">
      <section class="homepage" id="homepage">
        <div class="container">
          <div class="row">
            <div class="col-12 col-md-5">
              <div class="homepage-content">
                <h1 class="homepage__title">Order your favourite food</h1>
                <p class="homepage__caption">
                  Hamburger has many flavors, have you tried Cheese Beef
                  Hamburger?
                </p>

                <div class="pricing">
                  <p class="pricing__price">
                    Total Order : <span> $5.39</span>
                  </p>
                  <div class="pricing-order">
                    <div class="pricing-order__numbers">
                      <svg
                        width="24"
                        height="24"
                        class="pricing-icon__plus"
                        viewBox="0 0 24 24"
                        fill="none"
                      >
                        <path
                          d="M12 5V19"
                          stroke="#7D7C7C"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                        <path
                          d="M5 12H19"
                          stroke="#7D7C7C"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                      <span class="pricing-order__number">0</span>
                      <svg
                        width="24"
                        height="24"
                        class="pricing-icon__min"
                        viewBox="0 0 24 24"
                        fill="none"
                      >
                        <path
                          d="M5 12H19"
                          stroke="#7D7C7C"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </div>
                    <div class="pricing-order__now">
                      <svg
                        width="24"
                        height="24"
                        class="pricing-icon__shopping"
                        viewBox="0 0 24 24"
                        fill="none"
                      >
                        <path
                          fill-rule="evenodd"
                          clip-rule="evenodd"
                          d="M5.9963 12C5.344 12 4.86633 12.6144 5.02717 13.2466L6.42488 18.7398C6.76319 20.0693 7.96032 21 9.33225 21H14.6652C16.0383 21 17.2362 20.0678 17.5734 18.7367L18.9644 13.2456C19.1245 12.6137 18.6469 12 17.9951 12H5.9963ZM9 16C9 15.4477 9.44771 15 10 15C10.5523 15 11 15.4477 11 16V17C11 17.5523 10.5523 18 10 18C9.44771 18 9 17.5523 9 17V16ZM13 16C13 15.4477 13.4477 15 14 15C14.5523 15 15 15.4477 15 16V17C15 17.5523 14.5523 18 14 18C13.4477 18 13 17.5523 13 17V16Z"
                          fill="#323232"
                        />
                        <path
                          d="M3 9C3 8.44772 3.44772 8 4 8H20C20.5523 8 21 8.44772 21 9C21 9.55228 20.5523 10 20 10H4C3.44772 10 3 9.55228 3 9Z"
                          fill="#323232"
                        />
                        <path
                          fill-rule="evenodd"
                          clip-rule="evenodd"
                          d="M10.7071 4.70711C11.0976 4.31658 11.0976 3.68342 10.7071 3.29289C10.3166 2.90237 9.68342 2.90237 9.29289 3.29289L8.29289 4.29289C7.90237 4.68342 7.90237 5.31658 8.29289 5.70711C8.68342 6.09763 9.31658 6.09763 9.70711 5.70711L10.7071 4.70711ZM13.2929 4.70711C12.9024 4.31658 12.9024 3.68342 13.2929 3.29289C13.6834 2.90237 14.3166 2.90237 14.7071 3.29289L15.7071 4.29289C16.0976 4.68342 16.0976 5.31658 15.7071 5.70711C15.3166 6.09763 14.6834 6.09763 14.2929 5.70711L13.2929 4.70711Z"
                          fill="#323232"
                        />
                      </svg>
                      <p class="pricing-order__now__title">Order now</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-7">
              <div class="homepage-photo">
                <img
                  src="./images/Hamberger-home.png"
                  class="homepage_img"
                  alt="burger"
                />
              </div>
              <div class="delivery">
                <div class="delivery-recived">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                      d="M3 13C3 8.02944 7.02944 4 12 4C16.9706 4 21 8.02944 21 13C21 17.9706 16.9706 22 12 22C7.02944 22 3 17.9706 3 13ZM13 9C13 8.44772 12.5523 8 12 8C11.4477 8 11 8.44772 11 9V13C11 13.2652 11.1054 13.5196 11.2929 13.7071L13.2929 15.7071C13.6834 16.0976 14.3166 16.0976 14.7071 15.7071C15.0976 15.3166 15.0976 14.6834 14.7071 14.2929L13 12.5858V9Z"
                      fill="#323232"
                    />
                    <path
                      d="M4.60006 5.30006C4.15823 5.63143 3.53143 5.54189 3.20006 5.10006C2.86869 4.65823 2.95823 4.03143 3.40006 3.70006L5.40006 2.20006C5.84189 1.86869 6.46869 1.95823 6.80006 2.40006C7.13143 2.84189 7.04189 3.46869 6.60006 3.80006L4.60006 5.30006Z"
                      fill="#323232"
                    />
                    <path
                      d="M18.6001 2.20018C18.1582 1.86881 17.5314 1.95835 17.2001 2.40018C16.8687 2.842 16.9582 3.46881 17.4001 3.80018L19.4001 5.30018C19.8419 5.63155 20.4687 5.542 20.8001 5.10018C21.1314 4.65835 21.0419 4.03155 20.6001 3.70018L18.6001 2.20018Z"
                      fill="#323232"
                    />
                  </svg>
                  <p class="delivery-recived__title">Delivery</p>
                </div>
                <p class="delivery-time">30 mins</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="./scripts/app.js"></script>
  </body>
</html>
